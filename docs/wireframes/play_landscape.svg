<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Climb Game 가로 화면과 네 손가락 조작 배치 초안</title>
  <desc id="desc">왼쪽 위 왼손, 왼쪽 아래 왼발, 오른쪽 위 오른손, 오른쪽 아래 오른발 패드. 중앙 벽의 캐릭터와 홀드를 조작한다. 최종 그래픽이 아닌 구조 검토용 와이어프레임이다.</desc>
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M 44 0 L 0 0 0 44" fill="none" stroke="#26364a" stroke-width="1"/></pattern>
    <style>
      text{font-family:'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo',sans-serif}
      .title{font-size:34px;font-weight:700;fill:#f2f6fc}
      .sub{font-size:20px;fill:#99adc4}
      .label{font-size:25px;font-weight:700;fill:#eff5fc}
      .pad{font-size:22px;font-weight:700;fill:#eff5fc}
      .small{font-size:18px;fill:#aebed0}
      .num{font-size:40px;font-weight:700;fill:#f1f6fc}
    </style>
  </defs>
